<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #080d15; }
      body { font-family: Arial, Helvetica, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #080d15; }
      .scene { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; opacity: 0; transform: scale(1.025); filter: blur(3px); }
      .intro, .outro { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 108px; color: #f8fafc; overflow: hidden; }
      .intro { background: radial-gradient(circle at 78% 18%, #263f5d 0, #111d31 30%, #080d15 62%); opacity: 0; }
      .outro { background: radial-gradient(circle at 22% 80%, #173250 0, #0b1320 38%, #080d15 75%); text-align: center; align-items: center; }
      .eyebrow { color: #72d7ff; font-size: 31px; letter-spacing: 8px; font-weight: 700; margin-bottom: 28px; }
      h1 { font-size: 92px; line-height: 1.04; letter-spacing: -4px; margin: 0; max-width: 810px; }
      .accent { color: #72d7ff; }
      .sub { margin-top: 38px; font-size: 35px; line-height: 1.3; color: #cbd5e1; max-width: 780px; }
      .orb { position: absolute; border-radius: 999px; border: 1px solid rgba(114,215,255,.28); width: 520px; height: 520px; right: -170px; top: -130px; box-shadow: 0 0 130px rgba(75,158,210,.22), inset 0 0 90px rgba(75,158,210,.10); }
      .orb:after { content: ''; position: absolute; inset: 72px; border-radius: inherit; border: 1px solid rgba(255,255,255,.13); }
      .grain { position: absolute; inset: -20px; opacity: .075; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 150 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E"); }
      .wipe { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 0%, rgba(114,215,255,.20) 48%, rgba(255,255,255,.76) 50%, rgba(114,215,255,.18) 52%, transparent 100%); mix-blend-mode: screen; opacity: 0; pointer-events: none; }
      .brand { font-size: 82px; font-weight: 800; letter-spacing: -3px; }
      .brand span { color: #72d7ff; }
      .outro .sub { max-width: 700px; }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="eblock-short-sales-teaser" data-start="0" data-duration="38" data-width="1080" data-height="1920" data-fps="30">
      <section id="intro" class="intro clip" data-start="0" data-duration="2" data-track-index="2">
        <div class="orb"></div><div class="grain"></div>
        <div class="eyebrow">E-BLOCK</div>
        <h1>¿Reservas y pagos<br /><span class="accent">por mensajes?</span></h1>
        <p class="sub">Una operación clara empieza por un flujo claro.</p>
      </section>
      <video id="resident" class="scene clip" data-start="2" data-duration="8" data-track-index="0" src="assets/resident-access.mp4" muted playsinline preload="auto"></video>
      <video id="rent" class="scene clip" data-start="10" data-duration="8" data-track-index="0" src="assets/rent-overview.mp4" muted playsinline preload="auto"></video>
      <video id="laundry" class="scene clip" data-start="18" data-duration="10" data-track-index="0" src="assets/laundry-flow.mp4" muted playsinline preload="auto"></video>
      <video id="admin" class="scene clip" data-start="28" data-duration="8" data-track-index="0" src="assets/admin-review.mp4" muted playsinline preload="auto"></video>
      <section id="outro" class="outro clip" data-start="36" data-duration="2" data-track-index="2">
        <div class="grain"></div><div class="brand">E-<span>BLOCK</span></div>
        <p class="sub">Menos coordinación dispersa.<br />Más claridad para residentes y administración.</p>
      </section>
      <audio id="narration" data-start="0" data-duration="35.952" data-track-index="1" src="assets/narration.mp3" preload="auto"></audio>
      <div id="wipe" class="wipe"></div>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
      tl.fromTo('#intro', { opacity: 0, scale: 1.02 }, { opacity: 1, scale: 1, duration: 0.42 }, 0)
        .fromTo('#intro h1', { y: 38, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55 }, 0.16)
        .fromTo('#intro .sub', { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42 }, 0.48);
      const scenes = [['#resident', 2], ['#rent', 10], ['#laundry', 18], ['#admin', 28]];
      scenes.forEach(([selector, at]) => {
        tl.fromTo(selector, { opacity: 0, scale: 1.025, filter: 'blur(3px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.34 }, at)
          .to(selector, { opacity: 0, scale: 1.015, filter: 'blur(2px)', duration: 0.28 }, at + (selector === '#laundry' ? 9.72 : 7.72));
      });
      [1.72, 9.76, 17.76, 27.76, 35.72].forEach((at) => tl.fromTo('#wipe', { xPercent: -115, opacity: 0 }, { xPercent: 115, opacity: 0.78, duration: 0.36, ease: 'power2.inOut' }, at));
      tl.fromTo('#outro', { opacity: 0, scale: 1.02 }, { opacity: 1, scale: 1, duration: 0.35 }, 35.72)
        .fromTo('#outro .brand', { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 35.9)
        .fromTo('#outro .sub', { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.38 }, 36.1);
      window.__timelines['eblock-short-sales-teaser'] = tl;
    </script>
  </body>
</html>
